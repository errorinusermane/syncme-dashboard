name: Vercel Deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Vercel project/org IDs
        id: vercel-ids
        run: |
          if [ -f .vercel/project.json ]; then
            node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('.vercel/project.json','utf8')); console.log('orgId=' + p.orgId); console.log('projectId=' + p.projectId);" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Vercel (Preview)
        if: github.event_name == 'pull_request'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ steps.vercel-ids.outputs.orgId || secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ steps.vercel-ids.outputs.projectId || secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ steps.vercel-ids.outputs.orgId || secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ steps.vercel-ids.outputs.projectId || secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
